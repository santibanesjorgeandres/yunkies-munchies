<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yunkies Munchies 🐤🐌</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0d0d0f; color: #f3f4f6; }
    .glass-card { background: rgba(22, 22, 26, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .pig-rating { cursor: pointer; transition: transform 0.15s ease; filter: grayscale(1); opacity: 0.4; }
    .pig-rating.active { filter: grayscale(0); opacity: 1; transform: scale(1.15); }
    .tab-active { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; }
  </style>
</head>
<body class="pb-24">

  <!-- ENCABEZADO PRINCIPAL -->
  <header class="sticky top-0 z-40 glass-card border-b border-white/10 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-extrabold text-orange-500 tracking-tight flex items-center gap-1.5">
          Yunkies Munchies <span class="text-sm font-semibold text-gray-400">🐤🐌</span>
        </h1>
        <p class="text-xs text-orange-400/90 font-medium tracking-wide">¡Qué rica la tragadera!</p>
      </div>
      <button id="userToggleBtn" onclick="toggleUser()" class="px-3 py-1.5 rounded-full text-xs font-bold bg-orange-500/20 text-orange-400 border border-orange-500/30 flex items-center gap-1">
        <span id="userBadge">Jorge 🐤</span>
      </button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- RESUMEN -->
    <div class="glass-card rounded-2xl p-4 flex justify-between items-center bg-gradient-to-r from-orange-950/30 to-amber-950/20">
      <div>
        <p class="text-xs text-gray-400 font-medium">Lugares descubiertos</p>
        <p id="totalCount" class="text-2xl font-black text-white">0</p>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-400 font-medium">Promedio de antojos</p>
        <p id="avgScore" class="text-lg font-extrabold text-amber-400">0.0 🐷</p>
      </div>
    </div>

    <!-- PESTAÑAS -->
    <div class="flex bg-white/5 p-1 rounded-xl gap-1">
      <button id="tabDescubiertos" onclick="switchTab('descubiertos')" class="flex-1 py-2 text-xs font-bold rounded-lg tab-active transition-all">🗺️ Descubiertos</button>
      <button id="tabPorVisitar" onclick="switchTab('porVisitar')" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 transition-all">📌 Por Visitar</button>
    </div>

    <!-- CONTENEDOR DE LISTAS -->
    <div id="munchiesList" class="space-y-4"></div>
  </main>

  <!-- BOTÓN FLOTANTE AGREGAR -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 z-50 w-14 h-14 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-orange-500/30 hover:scale-105 transition-transform active:scale-95">
    ➕
  </button>

  <!-- MODAL DE REGISTRO -->
  <div id="addModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-card w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="text-lg font-extrabold text-white">Nuevo Munchie 🍔</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">✕</button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Nombre del Restaurante / Lugar</label>
          <input type="text" id="inputNombre" placeholder="Ej. Tacos El Pastor" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Link de Google Maps</label>
          <input type="url" id="inputMaps" placeholder="https://maps.app.goo.gl/..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Tipo de Lista</label>
          <select id="inputType" onchange="toggleRatingFields()" class="w-full bg-white/10 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-orange-500">
            <option value="descubierto" class="bg-gray-900">Ya fuimos (Calificar ahora)</option>
            <option value="porVisitar" class="bg-gray-900">Por Visitar (Guardar para después)</option>
          </select>
        </div>

        <!-- SECCIÓN DE CALIFICACIONES -->
        <div id="ratingSection" class="space-y-4 pt-2 border-t border-white/10">
          <p class="text-xs font-extrabold text-orange-400 tracking-wider uppercase">Calificaciones en Puerquitos 🐷</p>
          
          <div class="space-y-3">
            <div class="bg-white/5 p-3 rounded-xl space-y-2">
              <span class="text-xs font-bold text-white">Sabor 😋</span>
              <div id="pigsSabor" class="flex gap-2 text-2xl"></div>
            </div>
            <div class="bg-white/5 p-3 rounded-xl space-y-2">
              <span class="text-xs font-bold text-white">Precio / Calidad 💸</span>
              <div id="pigsPrecio" class="flex gap-2 text-2xl"></div>
            </div>
            <div class="bg-white/5 p-3 rounded-xl space-y-2">
              <span class="text-xs font-bold text-white">Atención / Servicio ⚡</span>
              <div id="pigsAtencion" class="flex gap-2 text-2xl"></div>
            </div>
            <div class="bg-white/5 p-3 rounded-xl space-y-2">
              <span class="text-xs font-bold text-white">Lugar / Ambiente 🍷</span>
              <div id="pigsLugar" class="flex gap-2 text-2xl"></div>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 mb-1">Recuerdo / Platillo Imperdible</label>
          <textarea id="inputNota" rows="2" placeholder="Ej. Pedir sí o sí las papas con queso..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <button onclick="guardarLugar()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 font-extrabold rounded-xl text-white shadow-lg shadow-orange-500/20 active:scale-98 transition-transform">
          ¡Guardar Munchie! 🚀
        </button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = 'Jorge 🐤';
    let currentTab = 'descubiertos';
    let ratings = { sabor: 5, precio: 5, atencion: 5, lugar: 5 };

    function toggleUser() {
      currentUser = currentUser === 'Jorge 🐤' ? 'María 🐌' : 'Jorge 🐤';
      document.getElementById('userBadge').innerText = currentUser;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabDescubiertos').className = tab === 'descubiertos' ? 'flex-1 py-2 text-xs font-bold rounded-lg tab-active transition-all' : 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 transition-all';
      document.getElementById('tabPorVisitar').className = tab === 'porVisitar' ? 'flex-1 py-2 text-xs font-bold rounded-lg tab-active transition-all' : 'flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 transition-all';
      renderMunchies();
    }

    function setupPigPickers() {
      ['sabor', 'precio', 'atencion', 'lugar'].forEach(cat => {
        const container = document.getElementById(`pigs${cat.charAt(0).toUpperCase() + cat.slice(1)}`);
        container.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
          const span = document.createElement('span');
          span.className = `pig-rating ${i <= ratings[cat] ? 'active' : ''}`;
          span.innerText = '🐷';
          span.onclick = () => {
            ratings[cat] = i;
            setupPigPickers();
          };
          container.appendChild(span);
        }
      });
    }

    function toggleRatingFields() {
      const isDescubierto = document.getElementById('inputType').value === 'descubierto';
      document.getElementById('ratingSection').style.display = isDescubierto ? 'block' : 'none';
    }

    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      setupPigPickers();
      toggleRatingFields();
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function obtenerDatos() {
      const data = localStorage.getItem('yunkies_data');
      return data ? JSON.parse(data) : [];
    }

    function guardarLugar() {
      const nombre = document.getElementById('inputNombre').value.trim();
      const maps = document.getElementById('inputMaps').value.trim();
      const tipo = document.getElementById('inputType').value;
      const nota = document.getElementById('inputNota').value.trim();

      if (!nombre) return alert('Ingresa el nombre del lugar');

      const items = obtenerDatos();
      const nuevo = {
        id: Date.now().toString(),
        nombre,
        maps,
        tipo,
        nota,
        usuario: currentUser,
        ratings: tipo === 'descubierto' ? { ...ratings } : null
      };

      items.unshift(nuevo);
      localStorage.setItem('yunkies_data', JSON.stringify(items));
      closeModal();
      renderMunchies();
      
      // Limpiar campos
      document.getElementById('inputNombre').value = '';
      document.getElementById('inputMaps').value = '';
      document.getElementById('inputNota').value = '';
    }

    function renderMunchies() {
      const items = obtenerDatos().filter(x => x.tipo === currentTab);
      const list = document.getElementById('munchiesList');
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = `<p class="text-center text-sm text-gray-500 py-8">No hay lugares en esta lista aún. ¡Agrega uno con el botón ➕!</p>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-4 space-y-3';
        
        let ratingsHtml = '';
        if (item.ratings) {
          const avg = ((item.ratings.sabor + item.ratings.precio + item.ratings.atencion + item.ratings.lugar) / 4).toFixed(1);
          ratingsHtml = `
            <div class="grid grid-cols-2 gap-2 text-xs bg-white/5 p-2 rounded-xl">
              <div>Sabor: <b>${item.ratings.sabor} 🐷</b></div>
              <div>Precio: <b>${item.ratings.precio} 🐷</b></div>
              <div>Atención: <b>${item.ratings.atencion} 🐷</b></div>
              <div>Lugar: <b>${item.ratings.lugar} 🐷</b></div>
            </div>
            <p class="text-right text-xs font-bold text-amber-400">Promedio: ${avg} 🐷</p>
          `;
        }

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-bold text-white text-base">${item.nombre}</h4>
              <p class="text-xs text-gray-400">Agregado por: ${item.usuario}</p>
            </div>
            ${item.maps ? `<a href="${item.maps}" target="_blank" class="px-2.5 py-1 bg-green-500/20 text-green-400 border border-green-500/30 rounded-lg text-xs font-bold flex items-center gap-1">📍 Maps</a>` : ''}
          </div>
          ${item.nota ? `<p class="text-xs text-gray-300 italic">"${item.nota}"</p>` : ''}
          ${ratingsHtml}
        `;
        list.appendChild(card);
      });

      // Actualizar contadores
      const todos = obtenerDatos().filter(x => x.tipo === 'descubiertos');
      document.getElementById('totalCount').innerText = todos.length;
    }

    renderMunchies();
  </script>
</body>
</html>
